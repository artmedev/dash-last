# Production stack: app + Postgres. Secrets come from a .env file next to this file
# (see .env.prod.example). The reverse proxy (Traefik on the homelab) routes dash.artme.dev to app:3001.
services:
  app:
    build: .
    image: dash:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://dash:${POSTGRES_PASSWORD}@db:5432/dash
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}
    expose:
      - "3001"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dash
    volumes:
      - dash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dash"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dash_pgdata:
